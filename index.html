<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>锋造皮具</title>

<style>
body{
  margin:0;
  background:#0a0a0a;
  color:white;
  font-family:Arial, "Microsoft YaHei", sans-serif;
}

.hero{
  padding:90px 20px 60px;
  text-align:center;
}

h1{
  font-size:58px;
  margin-bottom:20px;
}

p{
  color:#b3b3b3;
  font-size:20px;
  max-width:850px;
  margin:auto;
  line-height:1.8;
}

.btn{
  display:inline-block;
  margin-top:35px;
  padding:15px 38px;
  background:white;
  color:black;
  text-decoration:none;
  border-radius:50px;
  font-weight:bold;
}

.section{
  padding:60px 20px 90px;
  max-width:1200px;
  margin:auto;
}

.hero-banner{
  width:100%;
  max-width:1200px;
  margin:30px auto 45px;
  border-radius:26px;
  overflow:hidden;
}

.hero-banner img{
  width:100%;
  display:block;
}

.cards{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
  gap:20px;
}

.card{
  background:#151515;
  border-radius:25px;
  padding:30px;
}

.card h3{
  margin-top:0;
  font-size:22px;
}

.card p{
  font-size:18px;
  color:#b3b3b3;
}

@media(max-width:768px){
  h1{
    font-size:38px;
  }

  p{
    font-size:17px;
  }

  .hero{
    padding:70px 18px 40px;
  }

  .section{
    padding:40px 18px 70px;
  }
}
</style>
</head>

<body>

<div class="hero">
  <h1>锋造皮具</h1>
  <p>
    专注风琴卡包、PU钱包、化妆包与收纳包生产，
    支持OEM/ODM定制、批发采购、电商供货与品牌合作。
  </p>

  <a class="btn" href="product.html">查看产品</a>
</div>

<div class="section">
  <h2>工厂介绍</h2>

  <div class="hero-banner">
    <img src="1.3.png" alt="锋造皮具工厂背景图">
  </div>

  <div class="cards">
    <div class="card">
      <h3>风琴卡包</h3>
      <p>多卡位设计，适合电商、批发与品牌定制。</p>
    </div>

    <div class="card">
      <h3>PU皮革钱包</h3>
      <p>支持颜色、Logo、材质与包装定制。</p>
    </div>

    <div class="card">
      <h3>化妆包 / 收纳包</h3>
      <p>适合礼品、旅行与跨境销售。</p>
    </div>
  </div>
</div>

</body>
</html>
