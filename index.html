<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>锋造皮具</title>

<style>
body{
  margin:0;
  background:#0a0a0a;
  color:white;
  font-family:Arial, "Microsoft YaHei", sans-serif;
}

.hero{
  padding:100px 20px;
  text-align:center;
}

h1{
  font-size:60px;
  margin-bottom:20px;
}

p{
  color:#b3b3b3;
  font-size:20px;
  max-width:800px;
  margin:auto;
  line-height:1.8;
}

.btn{
  display:inline-block;
  margin-top:40px;
  padding:15px 35px;
  background:white;
  color:black;
  text-decoration:none;
  border-radius:50px;
  font-weight:bold;
}

.section{
  padding:80px 20px;
  max-width:1200px;
  margin:auto;
}

.slider{
  width:100%;
  max-width:1200px;
  margin:30px auto;
  overflow:hidden;
  position:relative;
}

.slide{
  width:100%;
  height:auto;
  position:absolute;
  left:0;
  top:0;
  opacity:0;
  transition:opacity 0.8s ease;
}

.slide.active{
  opacity:1;
  position:relative;
}

.cards{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
  gap:20px;
  margin-top:40px;
}

.card{
  background:#151515;
  border-radius:25px;
  padding:30px;
}

.card h3{
  margin-top:0;
}

@media(max-width:768px){
  h1{
    font-size:42px;
  }

  .hero{
    padding:70px 20px;
  }
}
</style>
</head>

<body>

<div class="hero">
  <h1>测试网站</h1>
  <p>
    专注风琴卡包、PU钱包、化妆包与收纳包生产，
    支持OEM/ODM定制、批发采购、电商供货与品牌合作。
  </p>

  <a class="btn" href="product.html">立即咨询</a>
</div>

<div class="section">
  <h2>介绍</h2>

  <div class="slider">
    <img class="slide active" src="1.1.jpg">
    <img class="slide" src="1.jpg">
    <img class="slide" src="2.png">
    <img class="slide" src="3.png">
  </div>

  <div class="cards">
    <div class="card">
      <h3>风琴卡包</h3>
      <p>多卡位设计，适合电商、批发与品牌定制。</p>
    </div>

    <div class="card">
      <h3>PU皮革钱包</h3>
      <p>支持颜色、Logo、材质与包装定制。</p>
    </div>

    <div class="card">
      <h3>化妆包 / 收纳包</h3>
      <p>适合礼品、旅行与跨境销售。</p>
    </div>
  </div>
</div>

<script>
let index = 0;
const slides = document.querySelectorAll('.slide');

setInterval(() => {
  slides[index].classList.remove('active');
  index = (index + 1) % slides.length;
  slides[index].classList.add('active');
}, 3000);
</script>

</body>
</html>
