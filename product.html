<head>
<meta charset="UTF-8">

<style>
body{
    background:#0a0a0a;
    color:white;
    font-family:Arial;

    background:#111;

<body>

<h1>产品中心</h1>

<style>
body{
  background:#0a0a0a;
  color:white;
  font-family:Arial;
  padding:40px;
}

.product-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:25px;
}

.product-card{
  background:#111;
  border-radius:18px;
  padding:15px;
}

.product-card img{
  width:100%;
  border-radius:15px;
}

.product-card h3{
  font-size:18px;
  margin:12px 0 8px;
}

.product-card p{
  color:#aaa;
  font-size:14px;
}
</style>

<h1>产品中心</h1>

<div class="product-grid">

  <div class="product-card">
    <img src="1.jpg">
    <h3>新款棋盘格风琴卡包 多卡位拉链卡夹 PU便携零钱包</h3>
    <p>多卡位收纳，支持OEM定制。</p>
  </div>

  <div class="product-card">
    <img src="2.jpg">
    <h3>PU皮革钱包</h3>
    <p>颜色、Logo、材质均可定制。</p>
  </div>

  <div class="product-card">
    <img src="3.png">
    <h3>大容量拉链卡包 大容量多卡位银行卡收纳包 防泼水耐磨便携名片</h3>
    <p>适合批发、电商与礼品采购。</p>
  </div>

  <div class="product-card">
    <img src="4.png">
    <h3>收纳包</h3>
    <p>支持来样生产与批量供货。</p>
  </div>

</div>
